{% extends 'base.html' %}

{% block title %}سجل المدفوعات{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold"><i class="fa-solid fa-money-bill-wave me-2"></i>سجل الدفعات المسددة</h3>
</div>

<!-- تسجيل دفعة جديدة -->
<div class="card shadow-sm border-0 rounded-3 mb-4">
    <div class="card-body">
        <h6 class="fw-bold mb-3">تسديد دفعة من دين عميل</h6>
        <form id="payment-form" class="row g-3 align-items-end">
            <div class="col-md-5">
                <label class="form-label">العميل</label>
                <select id="pay-customer" class="form-select" required></select>
            </div>
            <div class="col-md-4">
                <label class="form-label">المبلغ <span id="remaining-hint" class="text-muted small"></span></label>
                <input type="number" step="0.01" min="0.01" id="pay-amount" class="form-control" required>
            </div>
            <div class="col-md-3">
                <button type="submit" id="pay-save" class="btn btn-success w-100"><i class="fa-solid fa-check me-1"></i> تسجيل الدفعة</button>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 text-center">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>اسم العميل</th>
                        <th>المبلغ المدفوع</th>
                        <th>التاريخ</th>
                    </tr>
                </thead>
                <tbody id="payments-table-body">
                    <tr><td colspan="4" class="text-muted py-4">جاري تحميل البيانات...</td></tr>
                </tbody>
            </table>
        </div>
        <div id="pager"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let page = 1, debtors = [];

async function loadPayments() {
    const tbody = document.getElementById('payments-table-body');
    try {
        const r = await api(`${A}/payments/?page=${page}`);
        if (!r.ok) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-danger py-4">${esc(errText(r.data))}</td></tr>`;
            return;
        }
        const payments = r.data.results || r.data;
        if (!payments.length && page > 1) { page--; return loadPayments(); }
        if (!payments.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-muted py-4">لا توجد مدفوعات مسجلة</td></tr>';
            renderPager('pager', null);
            return;
        }
        tbody.innerHTML = payments.map(p => `<tr>
            <td>#${p.id}</td>
            <td class="fw-bold">${esc(p.customer || '—')}</td>
            <td class="text-success fw-bold">${money(p.amount)}</td>
            <td>${esc(p.date)}</td>
        </tr>`).join('');
        renderPager('pager', r.data, page, p => { page = p; loadPayments(); });
    } catch (err) { console.error(err); }
}

// العملاء الذين عليهم دين متبقٍ فقط (الـ API يرفض أي دفعة أكبر من المتبقي)
async function loadDebtors() {
    const sel = document.getElementById('pay-customer');
    try {
        const customers = await fetchAll(`${A}/customers/`);
        debtors = customers.filter(c => parseFloat(c.total_remaining) > 0);
        sel.innerHTML = '<option value="">— اختر عميلاً —</option>' + debtors.map(c =>
            `<option value="${esc(c.name)}" data-rem="${c.total_remaining}">${esc(c.name)} — المتبقي ${money(c.total_remaining)}</option>`).join('');
        const pre = new URLSearchParams(location.search).get('customer');
        if (pre) { sel.value = pre; sel.dispatchEvent(new Event('change')); }
    } catch (e) { toast(e.message, 'danger'); }
}

document.addEventListener('DOMContentLoaded', () => {
    loadPayments();
    loadDebtors();

    const sel = document.getElementById('pay-customer');
    const amount = document.getElementById('pay-amount');
    sel.addEventListener('change', () => {
        const rem = sel.selectedOptions[0]?.dataset.rem;
        amount.max = rem || '';
        document.getElementById('remaining-hint').textContent = rem ? `(الحد الأقصى ${money(rem)})` : '';
    });

    document.getElementById('payment-form').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = document.getElementById('pay-save');
        btn.disabled = true;
        try {
            const r = await api(`${A}/payments/`, { method: 'POST', body: { customer: sel.value, amount: amount.value } });
            if (r.ok) {
                toast('تم تسجيل الدفعة');
                e.target.reset();
                document.getElementById('remaining-hint').textContent = '';
                page = 1;
                loadPayments();
                loadDebtors();
            } else toast(errText(r.data), 'danger');
        } finally { btn.disabled = false; }
    });
});
</script>
{% endblock %}
