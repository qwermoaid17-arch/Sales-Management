{% extends 'base.html' %}

{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 text-center">
                <div class="mb-3 text-primary">
                    <i class="fa-solid fa-lock display-4"></i>
                </div>
                <h4 class="fw-bold mb-3">تسجيل الدخول</h4>

                <div id="alert-box" class="alert alert-danger d-none text-end p-2 small"></div>

                <form id="login-form">
                    {% csrf_token %}
                    <div class="form-floating mb-3 text-end">
                        <input type="text" id="usernameInput" class="form-control rounded-3" placeholder="اسم المستخدم" required autofocus>
                        <label for="usernameInput">اسم المستخدم</label>
                    </div>
                    <div class="form-floating mb-4 text-end">
                        <input type="password" id="passwordInput" class="form-control rounded-3" placeholder="كلمة المرور" required>
                        <label for="passwordInput">كلمة المرور</label>
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 rounded-3 fw-bold">دخول</button>
                </form>
                <div class="mt-3 small text-muted">
                    ليس لديك حساب؟ <a href="{% url 'register' %}" class="text-decoration-none">إنشاء حساب</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// تنظيف أي توكنات قديمة عند فتح صفحة الدخول
clearTokens();

document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submitBtn');

    alertBox.classList.add('d-none');
    submitBtn.disabled = true;
    submitBtn.innerText = 'جاري التحقق...';

    const username = document.getElementById('usernameInput').value;
    const password = document.getElementById('passwordInput').value;
    const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;

    try {
        const response = await fetch(window.location.href, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
            body: JSON.stringify({ username, password })
        });
        const data = await response.json();

        if (response.ok && data.success) {
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);
            window.location.href = data.redirect_url;
        } else {
            alertBox.innerText = data.detail || 'بيانات الدخول غير صحيحة';
            alertBox.classList.remove('d-none');
        }
    } catch (err) {
        alertBox.innerText = 'حدث خطأ أثناء الاتصال بالخادم';
        alertBox.classList.remove('d-none');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'دخول';
    }
});
</script>
{% endblock %}
